# Remora settings. Apart from `login.auto_confirm`, every setting is optional; the values here
# are examples.

# Address to serve the REST API and signaling on. Put a TLS proxy in front of it.
listen = "127.0.0.1:8080"
# Origin clients reach Remora at. Required when `listen` is an unspecified address.
public_url = "https://remora.example"
# File holding the request signing key that clients are configured with. Without it, request
# signatures are not checked. Tokens are what authenticates users, but registering a device and
# starting a login need none, so on a server the internet can reach, use a random key that only
# your clients know.
# sign_key_file = "/etc/remora/sign.key"
# SQLite database for registered devices and the key that signs tokens. Without it they are
# kept in memory: a restart logs everyone out and forgets every device.
database = "/var/lib/remora/remora.db"
# Log filter: a level, or directives such as "info,remora_cloud=debug".
log = "info"

[ice]
# STUN and TURN servers for sessions. Without any, peers only find each other on the same
# network.
servers = ["stun:turn.example:3478", "turn:turn.example:3478"]
# File holding the secret shared with the TURN servers (coturn's `static-auth-secret`).
# Relative paths are relative to this file.
turn_secret_file = "turn.secret"
# Relay every session through TURN, so that host and viewer never learn each other's
# addresses.
force_relay = true

[login]
# Confirm every QR login without asking anyone, so that anyone who can reach Remora logs in as
# its user. Remora has no other way to confirm logins yet, so this must be true; keep Remora on a
# private network meanwhile.
auto_confirm = true
