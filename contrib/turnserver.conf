# coturn for Remora. Remora hands out short-lived credentials derived from a secret it shares
# with coturn (the TURN REST API convention).

listening-port=3478
# The address peers reach coturn at, when coturn is behind NAT.
#external-ip=203.0.113.10
realm=turn.example
fingerprint

use-auth-secret
# The same secret as Remora's `ice.turn_secret_file`.
static-auth-secret=CHANGE-ME

# Ports for relayed traffic; open them in the firewall, UDP.
min-port=49152
max-port=65535

# Plain TURN only. Configure cert and pkey to offer turns: as well.
no-tls
no-dtls
no-cli

# Keep clients from using the relay to reach the server's own networks. Drop the private ranges
# if coturn and every peer are on one private network.
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
