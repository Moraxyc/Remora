# Strict sans-IO dependency bans for `remora-proto` only.
# Licenses and sources are governed by the root `deny.toml`.
# Run with:
#   cargo deny --manifest-path crates/remora-proto/Cargo.toml --config crates/remora-proto/deny.toml check bans

[graph]
all-features = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    # Async runtimes and I/O reactors
    { crate = "tokio", reason = "remora-proto must remain sans-IO" },
    { crate = "async-std", reason = "remora-proto must remain sans-IO" },
    { crate = "smol", reason = "remora-proto must remain sans-IO" },
    { crate = "mio", reason = "remora-proto must remain sans-IO" },
    { crate = "futures-io", reason = "remora-proto must remain sans-IO" },
    # Networking, HTTP, WebSocket, TLS, WebRTC, and OS-level sockets
    { crate = "socket2", reason = "remora-proto must remain sans-IO" },
    { crate = "hyper", reason = "remora-proto must remain sans-IO" },
    { crate = "axum", reason = "remora-proto must remain sans-IO" },
    { crate = "reqwest", reason = "remora-proto must remain sans-IO" },
    { crate = "ureq", reason = "remora-proto must remain sans-IO" },
    { crate = "tungstenite", reason = "remora-proto must remain sans-IO" },
    { crate = "tokio-tungstenite", reason = "remora-proto must remain sans-IO" },
    { crate = "rustls", reason = "remora-proto must remain sans-IO" },
    { crate = "webpki-roots", reason = "remora-proto must remain sans-IO" },
    { crate = "str0m", reason = "remora-proto must remain sans-IO" },
    { crate = "webrtc", reason = "remora-proto must remain sans-IO" },
    { crate = "openidconnect", reason = "remora-proto must remain sans-IO" },
    { crate = "listenfd", reason = "remora-proto must remain sans-IO" },
    # Storage and OS entropy / process state
    { crate = "rusqlite", reason = "remora-proto must remain sans-IO" },
    { crate = "getrandom", reason = "remora-proto must remain sans-IO; pass random bytes/nonces from drivers" },
    # Higher-layer workspace crates
    { crate = "remora-endpoint", reason = "remora-proto is the lowest-layer crate" },
    { crate = "remora-cloud", reason = "remora-proto is the lowest-layer crate" },
    { crate = "remora-lab", reason = "remora-proto is the lowest-layer crate" },
]
