// gv_pb.proto — UU Remote CONTROL/RPC schema, reconstructed (unofficial).
//
// Source: SwiftProtobuf metadata in the official macOS UU Remote 4.48.1 (build 633)
//   UURemote.app/Contents/Helpers/UURemoteServer  (identical schema in MacOS/UURemote)
//   Swift module "UUProtoGenerated", Swift prefix "GvPb_", proto package "gv_pb".
//
// Exact:   message/enum names, field names, field numbers, enum values, nesting, oneof membership,
//          repeated, proto3 `optional` (Swift Optional scalar), message-vs-scalar kind.
// Inferred: the protobuf *scalar flavour*. Swift Int32 is emitted as int32 here, but could be
//          sint32/sfixed32 on the wire (same Swift type). uint64 likewise vs fixed64. Every
//          field that a third-party host already exchanges with official viewers uses plain
//          varint encoding, so int32/uint32/int64/uint64 is the safe default.
// Not in this file: JSON payloads (input events, terminal control, port-mapping SYN), the
//          "TERM" binary framing, Socket.IO events.
syntax = "proto3";

package gv_pb;

message ClipboardFormat {
  uint32 id = 1;
  string name = 2;
}

message DragDropAutoSave {
  string dest_path = 1;
}

message DragDropAutoSaveComplete {
  uint32 total_count = 1;
  uint32 success_count = 2;
  string first_file_name = 3;
}

message DragDropAutoSaveCompleteResponse {
  ClipboardError err = 1;
}

message DragDropOleDrop {
  double target_x = 1;
  double target_y = 2;
  int32 screen_id = 3;
}

message ClipboardFormatListRequest {
  repeated ClipboardFormat formats = 1;
  int32 has_action = 2;
  oneof drag_drop_action {
    DragDropAutoSave auto_save = 3;
    DragDropOleDrop ole_drop = 4;
  }
}

message ClipboardFormatListResponse {
}

message ClipboardFormatDataAsk {
  uint32 format_id = 1;
  string block_key = 2;
  string format_name = 3;
}

message ClipboardFormatDataConfirm {
  ClipboardError err = 1;
  string block_key = 2;
  int32 block_count = 3;
}

message ClipboardDataBlock {
  string block_key = 1;
  int32 block_id = 2;
  bytes data = 3;
}

message ClipboardDataBlockConfirm {
  string block_key = 1;
  int32 block_id = 2;
  ClipboardError err = 3;
}

message ClipboardFileDescriptor {
  string file_name = 1;
  uint32 file_attributes = 2;
  uint64 last_write_time = 3;
  uint64 file_size = 4;
}

message ClipboardFileDescriptorListRequest {
  uint32 task_id = 1;
}

message ClipboardFileDescriptorListResponse {
  uint32 task_id = 1;
  uint32 segment_count = 2;
  ClipboardError err = 3;
}

message ClipboardFileDescriptorSegment {
  uint32 task_id = 1;
  uint32 segment_id = 2;
  repeated ClipboardFileDescriptor file_descs = 3;
}

message ClipboardFileDescriptorSegmentConfirm {
  uint32 task_id = 1;
  uint32 segment_id = 2;
  ClipboardError err = 3;
}

message ClipboardFileContentsRequest {
  uint32 task_id = 1;
  uint32 list_index = 2;
  uint32 flags = 3;
  uint64 pos_offset = 4;
  uint32 requested_len = 5;
}

message ClipboardFileContentsResponse {
  uint32 task_id = 1;
  bytes data = 2;
  ClipboardError err = 3;
  uint64 pos_offset = 4;
  uint32 list_index = 5;
}

message ClipboardFileCancelRequest {
  uint32 task_id = 1;
}

message ClipboardFileCancelResponse {
  uint32 task_id = 1;
  ClipboardError err = 2;
}

message ClipboardTextChangeRequest {
  uint32 format_id = 1;
  string data = 2;
}

message ClipboardTextChangeResponse {
  ClipboardError err = 1;
}

message ClipboardRequest {
  oneof which {
    ClipboardFormatListRequest format_list = 1;
    ClipboardFormatDataAsk format_data_ask = 2;
    ClipboardDataBlock data_block = 3;
    ClipboardFileDescriptorListRequest file_desc_list_request = 4;
    ClipboardFileContentsRequest file_contents_request = 5;
    ClipboardFileCancelRequest cancel_request = 6;
    ClipboardFileDescriptorSegment desc_segment = 7;
    DragDropAutoSaveComplete auto_save_complete = 8;
  }
}

message ClipboardResponse {
  oneof which {
    ClipboardFormatListResponse format_list_response = 1;
    ClipboardFormatDataConfirm format_data_confirm = 2;
    ClipboardDataBlockConfirm data_block_confirm = 3;
    ClipboardFileDescriptorListResponse file_desc_list_response = 4;
    ClipboardFileContentsResponse file_contents_response = 5;
    ClipboardFileCancelResponse cancel_response = 6;
    ClipboardFileDescriptorSegmentConfirm desc_segment_confirm = 7;
    DragDropAutoSaveCompleteResponse auto_save_complete_response = 8;
  }
}

message CaptureParams {
  FPS fps = 1;
  VideoQuality video_quality = 2;
  bool cursor_capture = 3;
  ChooseResolutionType choose_resolution_type = 4;
  ScreenResolution local_resolution = 5;
  ScreenResolution choose_resolution = 6;
  ChromaFormat chroma_format = 7;
  int32 max_custom_bitrate = 8;
  bool enable_hdr = 9;
  VideoQuality auto_frame_quality = 10;
  int32 fpsCount = 11;
}

message DecoderCap {
  int32 fps = 1;
  CodecType codec_type = 2;
  int32 resolution_width = 3;
  int32 resolution_height = 4;
  ChromaFormat chroma_format = 5;
}

message VirtualDisplayMode {
  int32 width = 1;
  int32 height = 2;
  int32 VSync = 3;
}

message VirtualDisplayInitResolution {
  int32 width = 1;
  int32 height = 2;
}

message ConnectOptions {
  enum TypeEnum {
    CT_UNKNOWN = 0;
    CT_DESKTOP = 1;
    CT_WINDOW = 2;
    CT_MUMU = 3;
    CT_HOOK = 4;
    CT_FILETRANSFER = 5;
    CT_SECOND_SCREEN = 6;
    CT_QUICKLAUNCH = 7;
    CT_TERMINAL = 8;
    CT_PORTMAPPING = 9;
  }
  ConnectOptions.TypeEnum capture_type = 1;
  int32 type_value = 2;
  CaptureParams capture_params = 3;
  repeated DecoderCap decoder_cap_list = 4;
  bool force_virtual_display = 5;
  repeated VirtualDisplayMode virtual_display_modes = 6;
  VirtualDisplayInitResolution virtual_display_init_resolution = 7;
  ClientType client_type = 8;
  string device_id = 9;
  ControlConnectType control_connect_type = 10;
  FeatureFlag feature_flag = 11;
  string client_version = 12;
  string entitlement_data = 13;
  int64 current_server_time = 14;
}

message EncoderCap {
  CaptureMode capture_mode = 1;
  int32 fps = 2;
  CodecType corec_type = 3;
  int32 resolution_width = 4;
  int32 resolution_height = 5;
}

message CodecNegotiation {
  repeated EncoderCap encoder_cap_list = 1;
}

