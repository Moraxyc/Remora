[package]
name = "remora-proto"
description = "UU Remote wire protocol: messages and codecs, no I/O"
license = "MIT OR Apache-2.0"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = true

[dependencies]
hex = "0.4.3"
hmac = "0.13.0"
prost = "0.14.6"
rand_core = { version = "0.10.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"

[build-dependencies]
prost-build = "0.14.6"
protox = "0.10.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = { version = "1.2.1", default-features = false, features = ["parse", "serde"] }

[dev-dependencies]
toml = { version = "1.2.1", default-features = false, features = ["parse", "serde"] }
