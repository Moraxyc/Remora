[package]
name = "remora-lab"
description = "Conformance lab, headless platform, and scenario runner for Remora"
license = "MIT OR Apache-2.0"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "remora-lab"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.9", features = ["macros", "ws"] }
clap = { version = "4.6.8", features = ["derive"] }
futures-util = "0.3.34"
hex = "0.4.3"
http = "1.5.0"
prost = "0.14.6"
rand = "0.9.5"
remora-endpoint = { path = "../remora-endpoint", features = ["client", "record"] }
remora-proto = { path = "../remora-proto" }
reqwest = "0.13.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml_ng = "0.10.0"
tokio = { version = "1.54.1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = "0.30.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
