[package]
name = "remora-endpoint"
description = "UU Remote endpoint SDK: cloud control plane, signaling client, and trace recording"
license = "MIT OR Apache-2.0"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = true

[features]
default = ["client"]
client = [
    "dep:futures-core",
    "dep:futures-util",
    "dep:hex",
    "dep:http",
    "dep:rand",
    "dep:reqwest",
    "dep:rustls",
    "dep:rustls-platform-verifier",
    "dep:serde",
    "dep:serde_json",
    "dep:tokio",
    "dep:tokio-rustls",
    "dep:tokio-tungstenite",
    "dep:tracing",
    "dep:url",
]
peer = []
record = ["dep:hex", "dep:serde", "dep:serde_json"]

[dependencies]
futures-core = { version = "0.3.34", optional = true }
futures-util = { version = "0.3.34", features = ["sink"], optional = true }
hex = { version = "0.4.3", optional = true }
http = { version = "1.5.0", optional = true }
rand = { version = "0.9.5", optional = true }
remora-proto = { path = "../remora-proto", version = "0.1.0" }
reqwest = { version = "0.13.5", optional = true }
rustls = { version = "0.23.46", optional = true }
rustls-platform-verifier = { version = "0.7.1", optional = true }
serde = { version = "1.0.229", features = ["derive"], optional = true }
serde_json = { version = "1.0.154", optional = true }
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "rt", "sync", "time"], optional = true }
tokio-rustls = { version = "0.26.6", optional = true }
tokio-tungstenite = { version = "0.30.0", optional = true }
tracing = { version = "0.1.44", optional = true }
url = { version = "2.5.8", optional = true }

[dev-dependencies]
futures-util = "0.3.34"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "sync", "test-util", "time"] }
tokio-tungstenite = "0.30.0"
