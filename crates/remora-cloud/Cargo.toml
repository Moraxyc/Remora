[package]
name = "remora-cloud"
description = "Self-hostable stand-in for the NetEase UU Remote cloud"
license = "GPL-3.0-or-later"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "remora"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.9", features = ["macros", "ws"] }
base64 = "0.23.1"
clap = { version = "4.6.8", features = ["derive", "env"] }
getrandom = "0.4.3"
hex = "0.4.3"
hmac = "0.13.0"
remora-proto = { path = "../remora-proto" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.26.1", features = ["v4"] }

[dev-dependencies]
futures-util = "0.3.34"
http-body-util = "0.1.5"
tokio-tungstenite = "0.30.0"
tower = { version = "0.5.3", features = ["util"] }
