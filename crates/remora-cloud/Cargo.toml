[package]
name = "remora-cloud"
description = "Self-hostable stand-in for the NetEase UU Remote cloud"
license = "GPL-3.0-or-later"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "remora"
path = "src/main.rs"

[dependencies]
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["macros", "ws"] }
base64 = "0.23.1"
clap = { version = "4.6.8", features = ["derive"] }
getrandom = "0.4.3"
hex = "0.4.3"
hmac = "0.13.0"
ipnet = "2.12.2"
httpdate = "1.0.3"
openidconnect = { version = "4.1.0", default-features = false }
prost = "0.14.6"
remora-proto = { path = "../remora-proto" }
reqwest = "0.13.5"
rpassword = "7.5.5"
rusqlite = { version = "0.43.0", features = ["bundled"] }
rust-embed = { version = "8.14.0", features = ["interpolate-folder-path", "mime-guess"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
toml = { version = "1.2.1", default-features = false, features = ["parse", "serde"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.26.1", features = ["v4"] }
listenfd = "1.0.2"

[dev-dependencies]
futures-util = "=0.3.34"
http-body-util = "=0.1.5"
tokio-tungstenite = "=0.30.0"
tower = { version = "=0.5.3", features = ["util"] }
