# Dependency policy for the Remora workspace:
# - Enforce crate boundary rules: `remora-cloud` must not depend on `remora-endpoint`
#   (and `remora-proto` has its own `crates/remora-proto/deny.toml` forbidding I/O crates).
# - Reject `webpki-roots` (TLS clients must use OS trust stores via `rustls-platform-verifier`).
# - Enforce license compatibility across MIT/Apache-2.0 and GPL-3.0-or-later layers.

[graph]
all-features = true
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

[licenses]
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "GPL-3.0-or-later",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    { crate = "webpki-roots", reason = "TLS clients must verify against the OS trust store via rustls-platform-verifier" },
    { crate = "remora-endpoint", wrappers = ["remora-lab", "remora-mac-bridge"], reason = "remora-cloud and remora-proto must not depend on remora-endpoint" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
