# Workspace-wide dependency policy (licenses, sources, and crate boundaries).
# - Governs `[licenses]` and `[sources]` for the entire Cargo workspace.
# - Enforces workspace boundaries (`remora-cloud` and `remora-proto` must never depend on
#   `remora-endpoint`; `webpki-roots` is banned everywhere).
# - `remora-proto`'s strict sans-IO crate bans live in `crates/remora-proto/deny.toml`.

[graph]
all-features = true

[licenses]
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "GPL-3.0-or-later",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    { crate = "webpki-roots", reason = "TLS clients must verify against the OS trust store via rustls-platform-verifier" },
    { crate = "remora-endpoint", wrappers = ["remora-lab", "remora-mac-bridge"], reason = "remora-cloud and remora-proto must not depend on remora-endpoint" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
