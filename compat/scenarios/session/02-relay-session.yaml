name: 02-relay-session
description: Lab Host and Viewer establish a forced-TURN-relayed WebRTC session through Remora and verify frames, input roundtrip, and bidirectional clipboard
profile: windows-4.48.2

actors:
  host:
    kind: host
    device_name: session-relay-host
  viewer:
    kind: viewer
    device_name: session-relay-viewer

steps:
  - actor: host
    action: device_init
    expect:
      http_status: 200
      code: 0

  - actor: host
    action: login
    expect:
      http_status: 200
      code: 0

  - actor: host
    action: session_host_start
    force_relay: true
    loop_video: true

  - actor: viewer
    action: session_viewer_connect
    target: host
    token: "${host.user_token}"
    force_relay: true
    expect:
      ack_status: success
      json_eq:
        connected: true
        peer_ready: true
        is_relayed: true

  - actor: viewer
    action: session_wait
    min_frames: 3
    require_relayed: true
    expect:
      json_eq:
        min_frames_met: true
        is_relayed: true

  - actor: viewer
    action: session_send_input
    kind: kbd_press
    key: 66

  - actor: viewer
    action: session_send_input
    kind: mouse_move_absolute
    x: 0.25
    y: 0.75

  - actor: host
    action: session_wait
    min_inputs: 2
    require_relayed: true
    expect:
      json_eq:
        min_inputs_met: true
        is_relayed: true

  - actor: viewer
    action: session_set_clipboard
    text: "relay-clip-v2h"

  - actor: host
    action: session_wait
    expected_clipboard: "relay-clip-v2h"
    expect:
      json_eq:
        clipboard_matched: true

  - actor: host
    action: session_set_clipboard
    text: "relay-clip-h2v"

  - actor: viewer
    action: session_wait
    expected_clipboard: "relay-clip-h2v"
    expect:
      json_eq:
        clipboard_matched: true

  - actor: viewer
    action: session_close

  - actor: host
    action: session_close

  - actor: viewer
    action: device_unbind
    target: host
    token: "${host.user_token}"
    expect:
      http_status: 200
      code: 0

invariants:
  - no_secrets_in_logs
  - no_secrets_in_trace
  - redacted_trace
