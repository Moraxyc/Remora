name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  build:
    name: Build (${{ matrix.system }})
    needs: check
    strategy:
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      ARCHIVE: remora-${{ github.ref_name }}-${{ matrix.system }}
    steps:
      - uses: actions/checkout@v7

      - uses: wimpysworld/nothing-but-nix@v12

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            build-dir = /nix/build
            extra-substituters = https://nix-cache.qaq.li/remora
            extra-trusted-public-keys = remora:iOVASnJtE6oEaK6QW9cHYAL/GIN0Ieh+zeV80XCa7D8=

      - uses: ryanccn/attic-action@v0.5
        with:
          endpoint: ${{ vars.ATTIC_ENDPOINT }}
          cache: ${{ vars.ATTIC_CACHE }}
          token: ${{ secrets.ATTIC_TOKEN }}
          inputs-from: .
          skip-use: true

      - name: Check the tag names the workspace version
        run: |
          version=$(nix eval --raw .#remora.version)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the workspace version $version"
            exit 1
          fi

      - run: nix build .#remora-static .#remora-deb --print-build-logs

      - name: Pack
        run: |
          mkdir "$ARCHIVE"
          cp result/bin/remora README.md crates/remora-cloud/LICENSE contrib/* "$ARCHIVE"/
          tar -czf "$ARCHIVE.tar.gz" "$ARCHIVE"
          sha256sum "$ARCHIVE.tar.gz" > "$ARCHIVE.tar.gz.sha256"
          install -Dm644 -t deb result-1/*.deb

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARCHIVE }}
          path: |
            ${{ env.ARCHIVE }}.tar.gz*
            deb/*.deb
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    # The release is made by the GitHub App, so the job's own token only checks out.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31

      - run: nix profile add --inputs-from . nixpkgs#gh

      - uses: actions/create-github-app-token@v3
        id: app
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # pkgs.moraxyc.com indexes the Debian packages of each release that carries this manifest,
      # under the asset name its registration of Remora names. The tool always writes
      # moraxyc-manifest.json and verifies that name, so the rename comes last.
      - name: Write the APT manifest
        run: |
          for operation in manifest verify-artifacts; do
            nix run --inputs-from ./dev moraxyc-repo#moraxyc-repo -- \
              "$operation" --artifacts dist/deb --project remora --tag "$GITHUB_REF_NAME"
          done
          mv dist/deb/moraxyc-manifest.json dist/deb/remora-apt-manifest.json

      # With release immutability on, a published release can no longer gain or change assets,
      # so every asset goes onto a draft first. A rerun after a failure reuses that draft.
      - name: Publish an immutable GitHub release
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --generate-notes
          fi
          assets=(dist/*.tar.gz* dist/deb/*)
          gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false
          if [ "$(gh release view "$GITHUB_REF_NAME" --json isImmutable --jq .isImmutable)" != true ]; then
            echo "::error::The release is not immutable; turn on release immutability in the repository settings"
            exit 1
          fi
          gh release verify "$GITHUB_REF_NAME"
          for asset in "${assets[@]}"; do
            gh release verify-asset "$GITHUB_REF_NAME" "$asset"
          done
