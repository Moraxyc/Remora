name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: nix flake check (${{ matrix.system }})
    strategy:
      fail-fast: false
      # Run arm64 on main, manual runs and releases; pull requests only build and test x86_64.
      matrix:
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"system":"x86_64-linux","runner":"ubuntu-24.04","vm-test":true}]' || '[{"system":"x86_64-linux","runner":"ubuntu-24.04","vm-test":true},{"system":"aarch64-linux","runner":"ubuntu-24.04-arm","vm-test":false}]') }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      # Must run before Nix is installed: it mounts the reclaimed disk at /nix.
      # The NixOS VM test needs the space before it starts, so purge in the foreground.
      - uses: wimpysworld/nothing-but-nix@v12
        with:
          witness-carnage: true

      - uses: NixOS/nix-installer-action@v1
        with:
          extra-conf: |
            build-dir = /nix/build
            accept-flake-config = true
            fallback = true

      # Pushes every path the job built when it ends. Pull requests from forks get no token.
      - if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: ryanccn/attic-action@v0.5
        with:
          endpoint: ${{ vars.ATTIC_ENDPOINT }}
          cache: ${{ vars.ATTIC_CACHE }}
          token: ${{ secrets.ATTIC_TOKEN }}
          inputs-from: .
          skip-use: true

      - if: matrix.vm-test
        run: nix flake check --print-build-logs --keep-going

      - if: '!matrix.vm-test'
        env:
          checks: .#checks.${{ matrix.system }}
        # `--no-build` evaluates in read-only mode, which cannot copy the dev partition's flake
        # into the store, so `nix eval` must copy it first. Skip checks already covered on x86_64
        # (including NixOS VM tests, since arm runners have no KVM).
        run: |
          read -ra names <<< "$(nix eval --raw "$checks" --apply 'c: toString (builtins.attrNames (removeAttrs c [ "nixos" "compat" "interop-linux" "clippy" "fmt" "treefmt" ]))')"
          nix flake check --no-build
          nix build --no-link --print-build-logs --keep-going "${names[@]/#/$checks.}"

      - name: Pack Debian artifact
        run: |
          nix build .#remora-deb
          install -Dm644 -t deb result/*.deb

      - uses: actions/upload-artifact@v7
        with:
          name: remora-deb-${{ matrix.system }}
          path: deb/*.deb
          retention-days: 1
          if-no-files-found: error

  # The runner is a real Ubuntu, booted by systemd, so the package goes through apt, dpkg and
  # systemd as it would on a user's machine.
  debian-package:
    name: Debian package (${{ matrix.system }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"system":"x86_64-linux","runner":"ubuntu-24.04"}]' || '[{"system":"x86_64-linux","runner":"ubuntu-24.04"},{"system":"aarch64-linux","runner":"ubuntu-24.04-arm"}]') }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: remora-deb-${{ matrix.system }}
          path: deb

      - name: Lint
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends lintian
          lintian --fail-on error,warning --display-info deb/*.deb

      - name: Install, run, upgrade, remove and purge
        run: .github/scripts/test-debian-package.sh deb/*.deb
